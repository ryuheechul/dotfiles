# [tasks.bootstrap] - `mise bootstrap` runs a task named "bootstrap"
# automatically, after [tools] are installed (and after [bootstrap.repos] /
# [dotfiles] have run, so tpm/doom-emacs/nvim's config are all in place by
# the time these commands run).

[tasks.bootstrap]
run = '''
# bat
bat cache --build || true

# tinty - install the schemes repo, generate every item's theme file, and
# apply the last-used scheme (falling back to the default on a fresh
# machine), so the cached palette script + current_scheme state exist before
# any subscriber starts. guard: throwaway setups (containers,
# dotfiles-launchpad) never install it; `|| true` keeps a network flake from
# failing the whole bootstrap.
#
# first ensure the theme bus files exist even before the first apply (the
# old base16 bootstrap touched them for the same reason): watchers (emacs's
# file-notify, nvim's fwatch) error on a missing signal file, so this runs
# unconditionally - regardless of tinty's presence - while the install/apply
# below recreates both for real.
touch "${HOME}/.active-theme.updated-time" 2>/dev/null || true
touch "${HOME}/.active-theme" 2>/dev/null || true

# initialize the light/dark pair files (the two tones, one tinty scheme name
# each) through `theme-pair` (../../../bin/path/default/theme-pair), the only
# interface to the pair. Reading a tone lazily creates its file with the
# default when missing and never overwrites an existing value, so these two
# lines boot a fresh machine with the defaults yet re-running this bootstrap
# cannot reset a pair you customized via theme-choose - initialization, not
# reset.
theme-pair light || true
theme-pair dark || true

if command -v tinty >/dev/null 2>&1; then
  tinty install || true
  # apply the last-used scheme (fallback: the pair's light tone on a fresh
  # machine); pipe so the scheme needs no nested quoting, `grep .` also falls
  # back on empty output. The fallback goes through `theme-pair`, the only
  # interface to the pair - a fresh machine applies whatever the pair
  # currently says, no family hardcoded. The pair files already exist from
  # the two `theme-pair` lines above.
  # If tinty is missing (dotfiles-less container) the apply no-ops via
  # `|| true`.
  { tinty current 2>/dev/null | grep . || theme-pair light; } | xargs tinty apply || true
fi

# tmux (tpm plugin install) - tpm reads ~/.tmux.conf straight off disk and
# doesn't need a running server, so this never touches the tmux server at all
# (starting/killing one here would hit the same default socket as a live
# session already attached in the current terminal, killing it out from
# under you)
"$HOME/.tmux/plugins/tpm/bin/install_plugins" || true

# doom emacs - runs interactively (no `yes |`): straight.el's prompts aren't
# all y/n (e.g. a numbered menu when a package's recipe points at a new git
# remote), and blindly answering "y" to those just loops forever since "y"
# never matches a valid choice - needs `mise bootstrap --raw`/`mise run
# --raw` for these prompts to actually reach a real terminal.
# SKIP_INSTALL_DOOM lets non-interactive/throwaway setups (containers,
# dotfiles-launchpad) opt out - those prompts can't be answered there anyway,
# so doom install would only hang or loop (mirrors SKIP_INSTALL_VIM_PLUGINS
# below).
if [ -n "$SKIP_INSTALL_DOOM" ]; then
  echo "doom emacs: skipping install (SKIP_INSTALL_DOOM set)"
elif command -v emacs >/dev/null 2>&1; then
  "$HOME/.doom-emacs.d/bin/doom" install || true
else
  echo "doom emacs: skipping install, emacs not found on PATH"
fi

# nvim
if [ -z "$SKIP_INSTALL_VIM_PLUGINS" ]; then
  nvim --headless "+Lazy! sync" +qa
  nvim --headless -c 'UpdateRemotePlugins' -c q || true
fi

# zsh (zinit) - source it now to install missing zsh plugins during
# bootstrap instead of on first interactive shell startup
zsh -c "source '$HOME/.config/dfs-rhc/zsh/my_addons/zinit'"

# gh extensions - install missing, upgrade the rest (the gh-ext-sync task in
# ../tasks/gh-ext-sync). the `|| true` keeps a gh network flake from failing
# the whole bootstrap, which every other step here is careful to never do.
mise run gh-ext-sync || true
'''
